[project]
name = "pulseos-backend"
version = "0.1.0"
description = "PulseOS backend — FastAPI modular monolith (ADR-001)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "firebase-admin>=6.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # SQLite driver so DB-layer and Alembic wiring tests run without Docker/Postgres.
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.format]
# Black-compatible defaults; ruff format replaces black (see docs/CONTRIBUTING.md).

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# firebase-admin ships no py.typed marker; its types stay confined to modules/auth/firebase.py.
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]

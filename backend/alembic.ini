# Alembic configuration (run from backend/: `alembic upgrade head`, `alembic revision ...`).
# The database URL is NOT set here — env.py reads it from the application Settings
# (PULSEOS_DATABASE_URL). Set sqlalchemy.url only to override explicitly (tests do this).

[alembic]
script_location = alembic
# Keep migration files chronologically sortable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =
